<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>CONNECT - Hidangan Sempurna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#2B2340;--ink2:#5E5373;--muted:#9A90AC;--coral:#FF6B57;--coralD:#D4412E;--teal:#14B3A1;--tealD:#0B8577;--purple:#7B5CFF;--purpleD:#5536D8;--yellow:#FFC83D;--yellowD:#DB9500;--cream:#FFF7EE;
  --fd:'Fredoka','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;--fn:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);--smooth:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{margin:0;overflow:hidden;background:#E9F1F4}
body{font-family:var(--fn);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;overscroll-behavior:none}
button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit;-webkit-tap-highlight-color:transparent}
input{font-family:inherit;-webkit-user-select:text;user-select:text}
svg{overflow:visible}

/* ---------- frame ---------- */
#app{position:relative;width:100%;height:600px;overflow:hidden;
  background:radial-gradient(70% 60% at 12% 8%,#FFE3C4 0,rgba(255,227,196,0) 60%),radial-gradient(60% 60% at 92% 92%,#C9EDE4 0,rgba(201,237,228,0) 60%),#EEF4F6}
#app::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(20,179,161,.14) 3px,transparent 3.5px);background-size:30px 30px}
#stage{position:absolute;left:50%;top:50%;width:720px;height:1200px;overflow:hidden;background:#F4F7F9;transform:translate(-50%,-50%);transform-origin:50% 50%}
#stage.framed{border-radius:36px;box-shadow:0 24px 70px rgba(80,30,40,.28)}
#scene{position:absolute;inset:0;z-index:1}
#scene>.bg,#scene>.fg,#scene>.actors{position:absolute;inset:0}
#scene>.bg svg,#scene>.fg svg{width:100%;height:100%;display:block}
#scene>.actors{z-index:2}
#scene>.fg{z-index:3;pointer-events:none}
#ui{position:absolute;inset:0;z-index:20;pointer-events:none}
#ui>*{pointer-events:none}
#ui .btn,#ui .copt,#ui .pick,#ui .hc,#ui .lensArea,#ui .work,#ui .namecard,#ui .tut,#ui .sheet{pointer-events:auto}
#fx{position:absolute;inset:0;z-index:70;pointer-events:none;overflow:hidden}
#copy{position:absolute;left:0;right:0;bottom:16px;text-align:center;z-index:65;pointer-events:none}
#copy span{display:inline-block;font:800 17px var(--fn);color:rgba(43,35,64,.62);background:rgba(255,255,255,.62);padding:5px 16px;border-radius:999px;letter-spacing:.3px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#copy.dark span{color:rgba(255,255,255,.75);background:rgba(20,12,40,.4)}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;height:120px;padding:24px 24px 0;display:flex;align-items:flex-start;gap:12px;z-index:55;pointer-events:none;transition:opacity .4s,transform .5s var(--smooth)}
#hud>*{pointer-events:auto}
#hud.hide{opacity:0;transform:translateY(-30px)}
.hchip{height:72px;border-radius:24px;background:rgba(255,255,255,.94);box-shadow:0 6px 0 rgba(43,35,64,.1),0 10px 24px rgba(43,35,64,.08);display:flex;align-items:center;gap:12px;padding:0 24px 0 10px;font:600 26px var(--fd);color:var(--ink);white-space:nowrap;transition:transform .4s var(--spring),opacity .3s}
.hchip .ic{width:52px;height:52px;border-radius:17px;background:linear-gradient(160deg,#FF8A6E,#FF5A48);display:grid;place-items:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.hchip .ic svg{width:32px;height:32px}
.hchip .av{width:52px;height:52px;border-radius:50%;overflow:hidden;background:#FFE2CF;flex:none}
.hchip .av svg{width:100%;height:100%;display:block}
.hchip.off{opacity:0;transform:scale(.6);pointer-events:none}
#who{max-width:300px;overflow:hidden}
#who b{overflow:hidden;text-overflow:ellipsis;font-weight:600}
#bgmBtn{margin-left:auto;width:100px;height:72px;border-radius:24px;background:rgba(255,255,255,.94);box-shadow:0 6px 0 rgba(43,35,64,.1),0 10px 24px rgba(43,35,64,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .12s,box-shadow .12s}
#bgmBtn:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(43,35,64,.1)}
#bgmBtn svg{width:42px;height:34px}
#bgmBtn span{font:900 13px var(--fn);letter-spacing:1.5px;color:var(--teal)}
#bgmBtn.off span{color:#B0A8C0}
@keyframes eq{from{transform:scaleY(.3)}to{transform:scaleY(1)}}
#bgmBtn.off .eq{display:none}#bgmBtn .x{display:none}#bgmBtn.off .x{display:inline}

/* ---------- characters ---------- */
.chr{position:absolute;pointer-events:none;transition:filter .35s}
.chr>svg{width:100%;height:100%;display:block}
.chr.dim{filter:brightness(.78) saturate(.8)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;height:100px;padding:0 54px;border-radius:32px;background:var(--coral);color:#fff;font:600 36px var(--fd);letter-spacing:.3px;
  box-shadow:0 9px 0 var(--coralD),0 18px 30px rgba(212,65,46,.25);transition:transform .12s,box-shadow .12s,opacity .3s,filter .3s;white-space:nowrap}
.btn:active{transform:translateY(7px);box-shadow:0 2px 0 var(--coralD)}
.btn svg{width:38px;height:38px}
.btn.teal{background:var(--teal);box-shadow:0 9px 0 var(--tealD),0 18px 30px rgba(11,133,119,.25)}.btn.teal:active{box-shadow:0 2px 0 var(--tealD)}
.btn.purple{background:var(--purple);box-shadow:0 9px 0 var(--purpleD),0 18px 30px rgba(85,54,216,.25)}.btn.purple:active{box-shadow:0 2px 0 var(--purpleD)}
.btn.white{background:#fff;color:var(--ink);box-shadow:0 9px 0 #E3DAEE,0 18px 30px rgba(43,35,64,.12)}.btn.white:active{box-shadow:0 2px 0 #E3DAEE}
.btn[disabled]{filter:grayscale(.7);opacity:.45;pointer-events:none}
.cta{position:absolute;left:50%;bottom:88px;transform:translateX(-50%);z-index:40}
.cta:active{transform:translateX(-50%) translateY(7px)}
.cta.wide{width:600px}

/* ---------- dialog ---------- */
.dlg{position:absolute;left:30px;right:30px;bottom:82px;min-height:206px;background:#fff;border-radius:38px;padding:56px 44px 44px;z-index:30;
  box-shadow:0 10px 0 rgba(43,35,64,.08),0 26px 50px rgba(43,35,64,.2)}
.dlg .tag{position:absolute;top:-30px;left:32px;height:62px;padding:0 28px 0 8px;border-radius:999px;background:var(--c);color:#fff;font:600 28px var(--fd);display:flex;align-items:center;gap:12px;box-shadow:0 6px 0 rgba(0,0,0,.14);max-width:calc(100% - 64px);white-space:nowrap}
.dlg .tag .av{width:48px;height:48px;border-radius:50%;background:#fff;overflow:hidden;flex:none;display:grid;place-items:center}
.dlg .tag .av svg{width:100%;height:100%;display:block}
.dlg .tag .av.ic svg{width:30px;height:30px}
.dlg .tag span:last-child{overflow:hidden;text-overflow:ellipsis}
.dlg .txt{font:800 33px/1.42 var(--fn);color:var(--ink)}
.dlg .txt b{color:var(--coral);font-weight:900}
.dlg .ch{opacity:0}.dlg .ch.on{opacity:1}
.dlg .more{position:absolute;right:34px;bottom:24px;display:flex;align-items:center;gap:8px;font:800 18px var(--fn);color:#B4AAC6;letter-spacing:.5px;opacity:0;transition:opacity .25s}
.dlg .more i{width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:13px solid #C4B9D6;animation:nudge .8s ease-in-out infinite alternate}
.dlg .more.on{opacity:1}
@keyframes nudge{to{transform:translateY(5px)}}

/* ---------- choice ---------- */
.choice{position:absolute;left:30px;right:30px;bottom:82px;z-index:31}
.choice .cq{display:table;margin:0 auto 22px;background:var(--ink);color:#fff;font:600 30px var(--fd);padding:14px 30px;border-radius:999px;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.choice .row{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.copt{background:#fff;border-radius:34px;padding:26px 16px 28px;display:flex;flex-direction:column;align-items:center;gap:16px;font:600 31px/1.18 var(--fd);color:var(--ink);text-align:center;
  box-shadow:0 9px 0 #E6DDF0,0 20px 40px rgba(43,35,64,.16);transition:transform .14s,box-shadow .14s}
.copt:active{transform:translateY(7px);box-shadow:0 2px 0 #E6DDF0}
.copt .ill{width:150px;height:150px;border-radius:42px;background:var(--bgc,#FFEDE6);display:grid;place-items:center;position:relative;overflow:hidden}
.copt .ill::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.7),rgba(255,255,255,0) 55%)}
.copt .ill svg{width:96px;height:96px;position:relative;z-index:1}

/* ---------- generic cards ---------- */
.card{background:#fff;border-radius:40px;box-shadow:0 10px 0 rgba(43,35,64,.07),0 26px 54px rgba(43,35,64,.16)}
.h1{font:700 52px/1.08 var(--fd);color:var(--ink);text-align:center}
.lead{font:800 28px/1.4 var(--fn);color:var(--ink2);text-align:center}
.chip{display:inline-flex;align-items:center;gap:12px;height:64px;padding:0 28px 0 12px;border-radius:999px;background:#fff;font:600 28px var(--fd);color:var(--ink);box-shadow:0 6px 0 rgba(43,35,64,.08),0 12px 26px rgba(43,35,64,.12)}
.chip .ci{width:44px;height:44px;border-radius:50%;background:var(--coral);display:grid;place-items:center}
.chip .ci svg{width:28px;height:28px}
.toptitle{position:absolute;left:0;right:0;top:140px;text-align:center;z-index:25}

/* ---------- title ---------- */
.ttl{position:absolute;left:0;right:0;top:150px;text-align:center;z-index:25}
.ttl .kick{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.9);color:var(--coral);font:700 24px var(--fd);letter-spacing:3px;padding:10px 26px;border-radius:999px;box-shadow:0 6px 0 rgba(43,35,64,.08)}
.ttl h1{font:700 138px/1 var(--fd);color:#fff;letter-spacing:2px;margin-top:22px;text-shadow:0 8px 0 #D4412E,0 16px 0 rgba(120,20,30,.18)}
.ttl .sub{display:inline-block;margin-top:16px;background:var(--ink);color:var(--yellow);font:600 42px var(--fd);padding:10px 34px;border-radius:24px;transform:rotate(-3deg);box-shadow:0 8px 0 rgba(0,0,0,.18)}
.ttl p{margin-top:26px;font:800 28px var(--fn);color:#fff;opacity:.95}

/* ---------- avatar / name ---------- */
.pickrow{position:absolute;left:36px;right:36px;top:290px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
.pick{position:relative;height:560px;border-radius:44px;background:#fff;box-shadow:0 10px 0 #EADFF3,0 24px 50px rgba(43,35,64,.14);overflow:hidden;transition:transform .45s var(--spring),box-shadow .3s}
.pick::before{content:'';position:absolute;left:50%;bottom:96px;width:230px;height:46px;margin-left:-115px;border-radius:50%;background:radial-gradient(closest-side,rgba(43,35,64,.14),rgba(43,35,64,0))}
.pick .pbg{position:absolute;inset:0;background:radial-gradient(90% 60% at 50% 30%,var(--pc) 0,rgba(255,255,255,0) 70%)}
.pick .pl{position:absolute;left:0;right:0;bottom:26px;text-align:center;font:600 36px var(--fd)}
.pick .ok{position:absolute;right:20px;top:20px;width:58px;height:58px;border-radius:50%;background:var(--teal);display:grid;place-items:center;transform:scale(0);transition:transform .4s var(--spring)}
.pick .ok svg{width:34px;height:34px}
.pick.sel{transform:translateY(-10px);box-shadow:0 10px 0 var(--teal),0 0 0 6px var(--teal),0 30px 60px rgba(20,179,161,.25)}
.pick.sel .ok{transform:scale(1)}
.namecard{position:absolute;left:44px;right:44px;top:700px;padding:42px 40px 44px;text-align:center}
.namecard label{display:block;font:600 36px var(--fd);margin-bottom:22px}
.namecard input{width:100%;height:100px;border-radius:30px;border:4px solid #EBE3F3;background:#FBF8FE;text-align:center;font:800 max(38px,var(--minFs,38px)) var(--fn);color:var(--ink);outline:none;transition:border-color .2s,background .2s}
.namecard input:focus{border-color:var(--teal);background:#fff}

/* ---------- hub ---------- */
.hub{position:absolute;left:24px;right:24px;top:250px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.hc{position:relative;height:610px;border-radius:40px;background:#fff;box-shadow:0 10px 0 #EADFF3,0 24px 48px rgba(43,35,64,.15);overflow:hidden;transition:transform .35s var(--spring)}
.hc:active{transform:scale(.96)}
.hc .hbg{position:absolute;left:0;right:0;top:0;height:430px;background:linear-gradient(180deg,var(--hc1),var(--hc2))}
.hc .hbg::after{content:'';position:absolute;left:50%;bottom:16px;width:150px;height:30px;margin-left:-75px;border-radius:50%;background:radial-gradient(closest-side,rgba(43,35,64,.2),rgba(43,35,64,0))}
.hc .nm{position:absolute;left:0;right:0;top:446px;text-align:center;font:600 36px var(--fd)}
.hc .st{position:absolute;left:14px;right:14px;top:502px;height:72px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:8px;font:800 20px/1.15 var(--fn);background:#F3EEF8;color:var(--ink2);text-align:center;padding:0 10px}
.hc .st svg{width:28px;height:28px;flex:none}
.hc.done .st{background:var(--teal);color:#fff}
.hc.done{box-shadow:0 10px 0 var(--teal),0 24px 48px rgba(20,179,161,.2)}
.hc .lock{position:absolute;inset:0;background:rgba(255,255,255,.0)}
.dots3{position:absolute;left:0;right:0;top:900px;display:flex;justify-content:center;gap:16px;align-items:center;font:800 26px var(--fn);color:var(--ink2)}
.dots3 i{width:22px;height:22px;border-radius:50%;background:#E5DCEE}
.dots3 i.on{background:var(--teal)}

/* ---------- investigate ---------- */
.lensArea{position:absolute;left:0;right:0;top:0;bottom:0;z-index:6;touch-action:none;cursor:grab}
.spot{position:absolute;width:96px;height:96px;margin:-48px 0 0 -48px;pointer-events:none;z-index:4}
.spot .ring{position:absolute;inset:0;border-radius:50%;border:5px solid rgba(255,214,84,.95);background:radial-gradient(circle,rgba(255,226,120,.28),rgba(255,226,120,.04) 70%)}
.spot::before{content:'';position:absolute;inset:-12px;border-radius:50%;border:4px solid rgba(255,214,84,.6);animation:spotP 1.6s ease-in-out infinite}
.spot.got::before{display:none}
.spot .sp{position:absolute;right:-12px;top:-14px;width:40px;height:40px}
.spot svg.prog{position:absolute;inset:-10px;width:116px;height:116px;transform:rotate(-90deg)}
.spot svg.prog circle{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round}
.spot.got .ring{animation:none;border:5px solid #3DDC97;background:radial-gradient(circle,rgba(61,220,151,.28),rgba(61,220,151,0) 70%)}
.spot.got .sp{display:none}
.spot .ok{position:absolute;right:-10px;top:-10px;width:42px;height:42px;border-radius:50%;background:#3DDC97;display:grid;place-items:center;transform:scale(0);transition:transform .45s var(--spring)}
.spot .ok svg{width:26px;height:26px}
.spot.got .ok{transform:scale(1)}
@keyframes spotP{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes twk{50%{transform:scale(.55) rotate(30deg);opacity:.6}}
.lens{position:absolute;left:0;top:0;width:250px;height:250px;margin:-125px 0 0 -125px;pointer-events:none;z-index:8;will-change:transform}
.lens .glass{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:#3A3157;box-shadow:0 0 0 11px #fff,0 0 0 17px #C98B4E,0 18px 36px rgba(0,0,0,.45)}
.lens .glass svg{position:absolute;inset:0;width:100%;height:100%}
.lens .shine{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.55) 0,rgba(255,255,255,0) 32%),radial-gradient(circle,rgba(160,220,255,0) 62%,rgba(160,220,255,.28) 100%)}
.lens .handle{position:absolute;left:192px;top:192px;width:40px;height:150px;border-radius:20px;background:linear-gradient(90deg,#B4743E,#D99A5C 45%,#9A5E2E);transform-origin:20px 0;transform:rotate(-45deg);box-shadow:0 10px 20px rgba(0,0,0,.35);z-index:-1}
.lens .handle::before{content:'';position:absolute;left:-4px;right:-4px;top:-6px;height:30px;border-radius:10px;background:linear-gradient(90deg,#9AA1B8,#E6E9F2 50%,#8C93A9)}
.ihead{position:absolute;left:0;right:0;top:132px;display:flex;justify-content:center;z-index:25}
.ihead .chip{background:rgba(255,255,255,.96)}
.ihint{position:absolute;left:50%;top:212px;transform:translateX(-50%);background:rgba(20,14,40,.78);color:#fff;font:800 25px var(--fn);padding:14px 26px;border-radius:999px;white-space:nowrap;z-index:25;transition:opacity .4s;display:flex;align-items:center;gap:12px}
.ihint svg{width:32px;height:32px}
.clue{position:absolute;left:40px;right:40px;top:210px;padding:24px 30px 26px 26px;display:flex;gap:22px;align-items:center;z-index:26;transform:translateY(-30px) scale(.9);opacity:0;transition:transform .5s var(--spring),opacity .3s}
.clue.show{transform:none;opacity:1}
.clue .ci{width:96px;height:96px;flex:none;border-radius:30px;background:#FFF1D6;display:grid;place-items:center}
.clue .ci svg{width:64px;height:64px}
.clue b{display:block;font:600 30px var(--fd);color:var(--coral);margin-bottom:4px}
.clue p{font:800 26px/1.35 var(--fn);color:var(--ink)}
.tray{position:absolute;left:30px;right:30px;bottom:82px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;z-index:25}
.slot{height:124px;border-radius:30px;background:rgba(255,255,255,.12);border:4px dashed rgba(255,255,255,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:800 20px/1.1 var(--fn);color:rgba(255,255,255,.6);text-align:center;padding:0 6px;transition:all .4s var(--smooth)}
.slot svg{width:50px;height:50px;opacity:.5}
.slot.ok{background:#fff;border:4px solid #fff;color:var(--ink);box-shadow:0 8px 0 rgba(0,0,0,.18)}
.slot.ok svg{opacity:1}

/* ---------- floating bubble / sheet ---------- */
.fbub{position:absolute;background:#fff;border-radius:28px;padding:16px 24px;font:800 26px/1.3 var(--fn);color:var(--ink);box-shadow:0 8px 0 rgba(43,35,64,.08),0 16px 32px rgba(43,35,64,.2);z-index:28;max-width:400px;transform-origin:var(--ox,50%) 100%}
.fbub::after{content:'';position:absolute;bottom:-12px;left:var(--tx,50%);width:26px;height:26px;margin-left:-13px;background:#fff;border-radius:5px;transform:rotate(45deg)}
.fbub.up::after{bottom:auto;top:-12px}
.sheet{position:absolute;left:24px;right:24px;bottom:72px;padding:46px 40px 42px;text-align:center;z-index:40;transform:translateY(130%);transition:transform .7s var(--spring)}
.sheet.show{transform:none}
.sheet .sic{width:110px;height:110px;margin:-104px auto 14px;border-radius:50%;background:#FFE7D6;display:grid;place-items:center;box-shadow:0 0 0 10px #fff}
.sheet .sic svg{width:64px;height:64px}
.sheet h3{font:700 42px var(--fd);margin-bottom:10px}
.sheet p{font:800 28px/1.4 var(--fn);color:var(--ink2)}
.sheet .hints{display:flex;gap:12px;justify-content:center;margin:22px 0 4px;flex-wrap:wrap}
.sheet .hints span{display:flex;align-items:center;gap:8px;background:#FFF4DA;border-radius:999px;padding:8px 18px 8px 10px;font:800 22px var(--fn)}
.sheet .hints svg{width:34px;height:34px}
.sheet .btn{margin-top:26px}

/* ---------- reveal / badge ---------- */
.badge{position:absolute;left:50%;top:190px;transform:translateX(-50%) rotate(-5deg);z-index:26;display:flex;align-items:center;gap:16px;background:var(--yellow);padding:16px 34px 16px 16px;border-radius:30px;box-shadow:0 8px 0 var(--yellowD),0 20px 40px rgba(219,149,0,.3);font:700 40px var(--fd);color:var(--ink);white-space:nowrap}
.badge .bi{width:70px;height:70px;border-radius:22px;background:#fff;display:grid;place-items:center}
.badge .bi svg{width:46px;height:46px}

/* ---------- games common ---------- */
.game{position:absolute;inset:0;overflow:hidden;touch-action:none}
.game canvas{position:absolute;left:0;top:0;width:720px;height:1200px;display:block}
.glayer{position:absolute;inset:0;pointer-events:none}
.tut{position:absolute;inset:0;z-index:45;display:grid;place-items:center;background:rgba(20,12,40,.45);transition:opacity .35s;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.tut.gone{opacity:0;pointer-events:none}
.tut .card{width:600px;padding:44px 40px 46px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px}
.tut .tic{width:170px;height:170px;border-radius:50%;background:#FFF0E3;display:grid;place-items:center}
.tut .tic svg{width:120px;height:120px}

<script>
(()=>{

/* stage scaling (fixed 600px height for the LMS) */

  }catch(e){}
}
function fit(force){
  if(!force&&isTyping())return;
  const app=$('#app');
  if(Math.abs(GAME_H-lastH)>1){lastH=GAME_H;app.style.height=GAME_H+'px';growFrame(GAME_H);}

addEventListener('resize',()=>fit());

function toStage(cx,cy){const r=stage.getBoundingClientRect();return{x:(cx-r.left)/SCALE,y:(cy-r.top)/SCALE};}

/* one global animation loop */
const TICK=new Set();

(function loop(now){const dt=Math.min(.05,Math.max(0,(now-_lt)/1000));_lt=now;

/* =========================================================

const Snd=(()=>{
  let ducked=false,ctx=null,master,mus,musF,sfx,echoIn,nbuf,on=true,mood='main',pend=null,nextT=0,step=0,bar=0,pourG=null,lastBlip=0;
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  const CH=[[60,64,67,72],[59,62,67,71],[57,60,64,69],[57,60,65,69]];
  const ROOT=[36,43,45,41];

    [[76,0,79,76,84,0,83,0],[74,0,79,74,83,0,81,0],[72,0,76,72,81,0,79,76],[77,0,76,0,74,0,72,0]],
    [[84,0,83,84,86,84,79,0],[83,0,81,83,86,0,83,0],[84,0,83,81,79,0,76,79],[81,0,79,77,79,0,0,0]]
  ];
  const MOOD={
    main:{bpm:124,kick:1,clap:1,hat:1,bass:1,stab:1,lead:1,arp:0,cut:9000,pad:0},
    game:{bpm:138,kick:1,clap:1,hat:2,bass:1,stab:1,lead:1,arp:1,cut:14000,pad:0},
    soft:{bpm:100,kick:0,clap:0,hat:0,bass:1,stab:0,lead:.55,arp:1,cut:1500,pad:1},
    win:{bpm:128,kick:1,clap:1,hat:2,bass:1,stab:1,lead:1,arp:1,cut:14000,pad:1}
  };
  function env(g,t,a,v,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(v,.0002),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);}

const JN=['uaL','faL','uaR','faR','thL','shL','thR','shR','hd','up'];

  chop:{uaR:-16,faR:-60,uaL:22,faL:-40,_m:'chop'},
  stir:{uaR:-20,faR:-70,_m:'stir'},
  run:{uaL:0,faL:-82,uaR:0,faR:-82,up:7,_m:'run'},
  trayRun:{uaL:24,faL:-76,uaR:-24,faR:76,_m:'trun'},
  walk:{_m:'walk'},
  waiter:{uaR:-100,faR:-62,uaL:16,faL:-30,_m:'wrun'},
  shrug:{uaL:48,faL:-86,uaR:-48,faR:86,_m:'idle'},
  hurt:{uaL:30,faL:-20,uaR:-30,faR:20,up:-8,_m:'idle'},

const RIGS=new Set();
class Rig{
  constructor(wrap,key,L){
    this.el=wrap;this.key=key;this.L=L;const svg=wrap.querySelector('svg');this.svg=svg;
    const q=c=>svg.querySelector('.j-'+c);
    this.g={};JN.forEach(j=>this.g[j]=q(j));['rt','sh','face','hf','hb','pL','pR','pC','glow'].forEach(j=>this.g[j]=q(j));
    this.g.eyes=q('eyes');this.g.mouth=q('mouth');
    this.J={...BASE};this.V={};JN.forEach(j=>this.V[j]=0);this.T={...BASE};
    this.mode='idle';this.t=rand(0,20);this.bt=rand(1,4);this.bl=0;this.talking=false;
    this.lx=0;this.ly=0;this.LX=0;this.LY=0;this.hy=0;this.hv=0;this.sq=0;this.sqv=0;this.runSpd=13;this.exName='smile';this.glowOn=0;this.gl=0;this.extraY=0;

  }
  pose(n){const P=POSES[n]||{};this.T={...BASE,...P};delete this.T._m;this.mode=P._m||'idle';this.poseName=n;return this;}
  snap(){for(const j of JN){this.J[j]=this.T[j];this.V[j]=0;}return this;}
  ex(e){if(!e||e===this.exName||this.svg.dataset.back)return this;this.exName=e;this.g.face.innerHTML=faceSVG(e,this.L);this.g.eyes=this.g.face.querySelector('.j-eyes');this.g.mouth=this.g.face.querySelector('.j-mouth');this.sqv-=.6;return this;}
  talk(on){this.talking=!!on;return this;}
  look(x,y=0){this.lx=x;this.ly=y;return this;}
  hop(p=1){if(this.hy>-1)this.hv=-280*p;this.sqv+=1.6*p;return this;}
  squash(p=1){this.sqv-=2*p;return this;}
  prop(side,name,arg){const g=this.g['p'+side];if(g)g.innerHTML=name?PROPS[name](this.L,side==='L'?70:side==='R'?130:100,arg):'';return this;}
  glow(on){this.glowOn=on?1:0;return this;}
  update(dt){
    this.t+=dt;const t=this.t,J=this.J,T=this.T,V=this.V;
    for(const j of JN){V[j]+=(T[j]-J[j])*190*dt;V[j]*=Math.exp(-15*dt);J[j]+=V[j]*dt;}
    const o={};let bob=0,br=Math.sin(t*2.3);

      case'idle':case'talk':o.uaL=br*2;o.uaR=-br*2;o.hd=Math.sin(t*.8)*1.8+(this.mode==='talk'||this.talking?Math.sin(t*5.3)*2.2:0);break;
      case'wave':o.faR=Math.sin(t*9)*24;o.uaR=Math.sin(t*9-.6)*6;o.uaL=br*2;o.hd=Math.sin(t*1.6)*3;break;
      case'cheer':{const c=Math.sin(t*8);o.uaL=c*12;o.uaR=-c*12;o.faL=c*10;o.faR=-c*10;bob=-Math.abs(Math.sin(t*4))*16;o.hd=Math.sin(t*4)*3;break;}
      case'clap':{const c=Math.sin(t*14);o.uaL=c*8;o.uaR=-c*8;o.hd=Math.sin(t*2)*2;bob=-Math.abs(Math.sin(t*7))*4;break;}
      case'chop':{o.faR=Math.max(0,Math.sin(t*12))*30;o.uaR=Math.max(0,Math.sin(t*12))*6;o.hd=6+Math.sin(t*1.2)*1.5;break;}

      case'run':{const p=t*this.runSpd,s=Math.sin(p);o.thL=38*s;o.thR=-38*s;o.shL=8+64*Math.max(0,Math.sin(p-.5));o.shR=8+64*Math.max(0,-Math.sin(p-.5));o.uaL=-34*s;o.uaR=34*s;bob=-Math.abs(Math.cos(p))*8;o.hd=Math.sin(p*2)*1.5;break;}
      case'trun':{const p=t*this.runSpd,s=Math.sin(p);o.thL=26*s;o.thR=-26*s;o.shL=6+40*Math.max(0,Math.sin(p-.5));o.shR=6+40*Math.max(0,-Math.sin(p-.5));bob=-Math.abs(Math.cos(p))*5;o.hd=Math.sin(p*2)*1.2;break;}
      case'wrun':{const p=t*this.runSpd,s=Math.sin(p);o.thL=30*s;o.thR=-30*s;o.shL=6+50*Math.max(0,Math.sin(p-.5));o.shR=6+50*Math.max(0,-Math.sin(p-.5));o.uaL=-22*s;bob=-Math.abs(Math.cos(p))*6;o.uaR=Math.sin(p*2)*2;break;}
      case'walk':{const p=t*8.5,s=Math.sin(p);o.thL=20*s;o.thR=-20*s;o.shL=22*Math.max(0,Math.sin(p-.4));o.shR=22*Math.max(0,-Math.sin(p-.4));o.uaL=-16*s;o.uaR=16*s;bob=-Math.abs(Math.cos(p))*5;break;}

    this.g.up.setAttribute('transform',`rotate(${A('up').toFixed(2)} 100 240) translate(0 ${(-br*.6).toFixed(2)})`);
    const Y=bob+this.hy+this.extraY;
    this.g.rt.setAttribute('transform',`translate(0 ${Y.toFixed(2)}) translate(100 306) scale(${sx.toFixed(4)} ${sy.toFixed(4)}) translate(-100 -306)`);
    const ss=1/(1+Math.max(0,-this.hy-bob)/170);this.g.sh.setAttribute('transform',`translate(100 307) scale(${ss.toFixed(3)}) translate(-100 -307)`);

    await c.animate([{transform:'translate(-50%,-50%) scale(2.2)',opacity:0},{transform:'translate(-50%,-50%) scale(1)',opacity:1,offset:.35},{transform:'translate(-50%,-50%) scale(1)',opacity:1,offset:.75},{transform:'translate(-50%,-50%) scale(.6)',opacity:0}],{duration:t.length>2?800:620,easing:'ease-out'}).finished;c.remove();}
}
function tutorial(icon,title,rules,btn='Mulai'){
  return new Promise(res=>{
    const t=h('div','tut',`<div class="card"><div class="tic">${icon}</div><h3>${title}</h3><div class="rules">${rules.map(r=>`<div>${r[0]}<span>${fmt(r[1])}</span></div>`).join('')}</div><button class="btn teal">${btn}${ICON.arrow}</button></div>`,uiEl);
    t.querySelector('.card').animate([{opacity:0,transform:'translateY(60px) scale(.9)'},{opacity:1,transform:'none'}],{duration:560,easing:SPRING});
    t.querySelector('.btn').onclick=e=>{e.stopPropagation();Snd.init();SFX.pop();t.classList.add('gone');setTimeout(()=>t.remove(),400);res();};
  });
}

/* animated hand gesture hint (stage coords). returns a stop() */
function handHint(frames,dur=1600){
  const e=h('div','pe-none',ICON.tap,uiEl);
  e.style.cssText='position:absolute;left:0;top:0;width:100px;height:100px;margin:-12px 0 0 -36px;z-index:60;pointer-events:none;filter:drop-shadow(0 8px 8px rgba(0,0,0,.3))';
  const a=e.animate(frames.map(f=>({transform:`translate(${f.x}px,${f.y}px) scale(${f.s||1})`,opacity:f.o??1,offset:f.k})),{duration:dur,iterations:Infinity,easing:'ease-in-out'});
  let done=false;return()=>{if(done)return;done=true;a.cancel();e.remove();};
}
const HH={
  press:(x,y)=>handHint([{x,y,s:1.1,o:0,k:0},{x,y,s:1.1,o:1,k:.15},{x,y,s:.85,k:.3},{x,y,s:.85,k:.8},{x,y,s:1.1,o:0,k:1}],2000),
  tap:(x,y)=>handHint([{x,y,s:1.1,k:0},{x,y,s:.85,k:.4},{x,y,s:1.1,k:1}],800),
  drag:(x1,y1,x2,y2)=>handHint([{x:x1,y:y1,s:1.1,o:0,k:0},{x:x1,y:y1,s:.9,o:1,k:.15},{x:x2,y:y2,s:.9,o:1,k:.75},{x:x2,y:y2,s:1.1,o:0,k:1}],1800),
  circle:(x,y,rx,ry)=>handHint(Array.from({length:9},(_,i)=>({x:x+Math.cos(i/8*Math.PI*2)*rx,y:y+Math.sin(i/8*Math.PI*2)*ry,s:.9,k:i/8})),1600),
  updown:(x,y,d)=>handHint([{x,y:y-d,s:.9,k:0},{x,y:y+d,s:.9,k:.5},{x,y:y-d,s:.9,k:1}],1000)
};

/* =========================================================
   shared canvas helpers + game chatter box
   ========================================================= */
function fitCanvas(cv){const k=Math.min(2,window.devicePixelRatio||1)*SCALE;const W=Math.round(720*k),H=Math.round(1200*k);if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}const c=cv.getContext('2d');c.setTransform(cv.width/720,0,0,cv.height/1200,0,0);return c;}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function sprite(w,hh,fn,RS=1.5){const cv=document.createElement('canvas');cv.width=Math.round(w*RS);cv.height=Math.round(hh*RS);const g=cv.getContext('2d');g.scale(RS,RS);g.translate(w/2,hh/2);fn(g);cv.W=w;cv.H=hh;return cv;}
function comms(k,top=136){
  const c=h('div','comms',`<span class="av">${headSVG(k)}</span><div class="tx"><b>${esc(WHO[k].name)}</b><span></span></div>`,uiEl);c.style.top=top+'px';
  let tm,cur=k;return(t,ms=2400,k2)=>{const kk=k2||k;if(kk!==cur){cur=kk;c.querySelector('.av').innerHTML=headSVG(kk);c.querySelector('.tx b').textContent=WHO[kk].name;}c.querySelector('.tx span').innerHTML=fmt(t);c.classList.add('show');c.querySelector('.av').animate([{transform:'scale(.8)'},{transform:'scale(1.08)'},{transform:'none'}],{duration:360});clearTimeout(tm);tm=setTimeout(()=>c.classList.remove('show'),ms);};
}
function meter(ic,total){
  const m=h('div','meter',`<span class="mi">${ic}</span><div class="tr"><i class="fl"></i></div><b>0/${total}</b>`,uiEl);
  return n=>{m.querySelector('.fl').style.width=(Math.min(1,n/total)*100)+'%';m.querySelector('b').textContent=`${Math.min(n,total)}/${total}`;m.querySelector('.mi').animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:260});};
}

const VEGK=Object.keys(VEG);
function gameSlice(){
  return new Promise(done=>{
    setScene(bgBoard());hud('full');Snd.mood('game');
    const root=h('div','game','<canvas></canvas>',actors());const cv=root.querySelector('canvas');
    let ctx=fitCanvas(cv);const onFit=()=>{ctx=fitCanvas(cv);};addEventListener('stagefit',onFit);
    const talk=comms('leo',236);const GOAL=16;const setM=meter(ICON.veg,GOAL);
    const SPR={};VEGK.forEach(k=>{SPR[k]=sprite(150,150,VEG[k].draw);});
    const items=[],halves=[],drops=[],splats=[],trail=[];let state='intro',T=0,next=.6,cut=0,lastTalk=0,hhStop=null;
    function spawn(){const n=cut<4?1:(Math.random()<.55?2:1)+(cut>9&&Math.random()<.3?1:0);
      for(let i=0;i<n;i++){const x=rand(170,550),k=pick(VEGK);items.push({k,x,y:1290+i*40,vx:(360-x)*rand(.25,.55)+rand(-60,60),vy:-rand(1330,1520),a:rand(0,6),va:rand(-2.5,2.5),r:VEG[k].r*1.45});}}
    function slice(it,ang){it.dead=true;cut++;setM(cut);SFX.slice();
      const nx=Math.cos(ang+Math.PI/2),ny=Math.sin(ang+Math.PI/2);
      [1,-1].forEach(s=>halves.push({k:it.k,x:it.x,y:it.y,vx:it.vx*.6-nx*s*230,vy:Math.min(it.vy,0)*.4-ny*s*230-120,a:ang,rel:it.a-ang,va:s*rand(2,4),side:s,l:1.6}));
      const J=VEG[it.k].jc;for(let i=0;i<14;i++){const a=rand(0,6.3),v=rand(140,420);drops.push({x:it.x,y:it.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,r:rand(4,9),c:J,l:rand(.4,.8)});}
      splats.push({x:it.x+rand(-20,20),y:it.y+rand(-20,20),r:rand(26,40),c:J,l:2.2});
      if(cut===GOAL){state='end';}
      const lines={3:'Oh, megang pisaunya gini, ya?',7:'Wah, lebih cepat dan rapi!',11:'Saya mulai pede, Chef!'};if(lines[cut])talk(lines[cut],2200);
    }
    /* input */
    let ptr=null;
    root.addEventListener('pointerdown',e=>{if(state!=='play')return;e.preventDefault();try{root.setPointerCapture(e.pointerId);}catch(_){}ptr={id:e.pointerId,...toStage(e.clientX,e.clientY)};trail.length=0;trail.push({x:ptr.x,y:ptr.y,t:T});if(hhStop){hhStop();hhStop=null;}});
    root.addEventListener('pointermove',e=>{if(!ptr||e.pointerId!==ptr.id||state==='intro')return;const p=toStage(e.clientX,e.clientY);const a=ptr;ptr={id:e.pointerId,...p};trail.push({x:p.x,y:p.y,t:T});
      const dx=p.x-a.x,dy=p.y-a.y,L2=dx*dx+dy*dy;if(L2<4)return;const ang=Math.atan2(dy,dx);
      for(const it of items){if(it.dead)continue;let t=((it.x-a.x)*dx+(it.y-a.y)*dy)/L2;t=clamp(t,0,1);const qx=a.x+dx*t,qy=a.y+dy*t;if(Math.hypot(it.x-qx,it.y-qy)<it.r)slice(it,ang);}});
    const up=e=>{if(ptr&&e.pointerId===ptr.id)ptr=null;};root.addEventListener('pointerup',up);root.addEventListener('pointercancel',up);
    function update(dt){
      T+=dt;
      if(state==='play'){next-=dt;if(next<=0&&cut<GOAL){spawn();next=cut<4?1.25:rand(.95,1.35);}if(T-lastTalk>9&&cut<GOAL){lastTalk=T;}}
      for(const it of items){it.vy+=1500*dt;it.x+=it.vx*dt;it.y+=it.vy*dt;it.a+=it.va*dt;if(it.vy>0&&it.y>1320)it.dead=true;}
      for(let i=items.length-1;i>=0;i--)if(items[i].dead)items.splice(i,1);
      for(const hf of halves){hf.vy+=1700*dt;hf.x+=hf.vx*dt;hf.y+=hf.vy*dt;hf.a+=hf.va*dt;hf.l-=dt;}
      for(let i=halves.length-1;i>=0;i--)if(halves[i].y>1400)halves.splice(i,1);
      for(const d of drops){d.vy+=1400*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.l-=dt;}for(let i=drops.length-1;i>=0;i--)if(drops[i].l<=0)drops.splice(i,1);
      for(const s of splats)s.l-=dt;for(let i=splats.length-1;i>=0;i--)if(splats[i].l<=0)splats.splice(i,1);
      while(trail.length&&T-trail[0].t>.12)trail.shift();
      /* draw */
      const c=ctx;c.clearRect(0,0,720,1200);
      for(const s of splats){c.globalAlpha=Math.min(1,s.l)*.35;c.fillStyle=s.c;c.beginPath();c.arc(s.x,s.y,s.r,0,7);c.arc(s.x+s.r*.8,s.y+s.r*.3,s.r*.35,0,7);c.arc(s.x-s.r*.6,s.y+s.r*.7,s.r*.25,0,7);c.fill();}c.globalAlpha=1;
      for(const it of items){c.save();c.translate(it.x,it.y);c.rotate(it.a);c.drawImage(SPR[it.k],-98,-98,196,196);c.restore();}
      for(const hf of halves){const V=VEG[hf.k];c.save();c.translate(hf.x,hf.y);c.rotate(hf.a);c.beginPath();if(hf.side>0)c.rect(-80,-80,160,80);else c.rect(-80,0,160,80);c.clip();c.rotate(hf.rel);c.drawImage(SPR[hf.k],-98,-98,196,196);c.rotate(-hf.rel);c.fillStyle=V.cut;c.beginPath();c.ellipse(0,0,V.r*1.0,7,0,0,7);c.fill();c.restore();}
      for(const d of drops){c.globalAlpha=clamp(d.l*2,0,1);c.fillStyle=d.c;c.beginPath();c.arc(d.x,d.y,d.r,0,7);c.fill();}c.globalAlpha=1;
      if(trail.length>1){c.lineCap='round';c.lineJoin='round';for(let pass=0;pass<2;pass++){c.strokeStyle=pass?'#fff':'rgba(127,224,255,.55)';for(let i=1;i<trail.length;i++){const k=i/trail.length;c.lineWidth=(pass?10:22)*k;c.beginPath();c.moveTo(trail[i-1].x,trail[i-1].y);c.lineTo(trail[i].x,trail[i].y);c.stroke();}}}
      if(state==='end'&&!items.length){state='out';finish();}
    }
    const stop=onTick(update);
    async function finish(){$$('.cta',uiEl).forEach(x=>x.remove());talk('Sayurnya siap, Chef!',2400);SFX.win();confetti(70);await sleep(2000);stop();removeEventListener('stagefit',onFit);done();}
    (async()=>{
      await tutorial(ICON.slash,'Potong Sayur',[[ICON.swipe,'**Geser jari** melewati sayur'],[ICON.veg,`Potong ${GOAL} sayur bareng Leo`]],'Mulai');
      talk('Saya lihat cara {S} motong, ya.',2600);
      await countdown(['3','2','1','POTONG!']);state='play';spawn();next=1.4;
      setTimeout(()=>{if(state!=='play')return;const b=h('button','btn cta teal',`<span>Potong semua</span>${ICON.check}`,uiEl);b.style.bottom='60px';
        b.animate([{opacity:0,transform:'translate(-50%,40px) scale(.9)'},{opacity:1,transform:'translate(-50%,0)'}],{duration:520,easing:SPRING,fill:'backwards'});
        talk('Sisanya saya bantu, Chef. Tinggal ketuk!',2600);
        b.onclick=e=>{e.stopPropagation();if(state!=='play')return;SFX.pop();b.remove();items.forEach(it=>{if(!it.dead)slice(it,rand(-.6,.6));});cut=GOAL;setM(GOAL);state='end';};},22000);
      setTimeout(()=>{if(state==='play'&&cut===0)hhStop=HH.drag(230,760,500,560);},700);
      setTimeout(()=>{if(state==='play'||state==='end')return;},45000);
    })();
  });
}

        const drawG=()=>G('cutG').innerHTML=lines.map(l=>l.done?'':`<path d="M${l.x-PC.x} ${ST.y-PC.y-95}V${ST.y-PC.y+95}" stroke="#fff" stroke-width="5" stroke-dasharray="10 9" stroke-linecap="round"><animate attributeName="opacity" values="1;.35;1" dur="1s" repeatCount="indefinite"/></path>`).join('');
        return{gest:()=>HH.drag(lines[0].x,ST.y-90,lines[0].x,ST.y+90),enter(){drawG();},
          down(p){G('knife').setAttribute('opacity',1);G('knife').setAttribute('transform',`translate(${p.x} ${p.y+60})`);},up(){G('knife').setAttribute('opacity',0);},
          move(p,pv){G('knife').setAttribute('transform',`translate(${p.x} ${p.y+60})`);const dy=p.y-pv.y;
            for(const l of lines){if(l.done)continue;if(Math.abs(p.x-l.x)<40&&Math.abs(p.y-ST.y)<130&&dy>0){l.acc+=dy;if(l.acc>110){l.done=true;open++;SFX.slice();sparkAt(l.x,ST.y,6);drawG();G('dStk').innerHTML=steakSlices(open/3,false);}}}
            if(lines.every(l=>l.done)){G('knife').setAttribute('opacity',0);G('cutG').innerHTML='';const t0=performance.now();
              const s=onTick(()=>{const k=Math.min(1,(performance.now()-t0)/500);G('dStk').innerHTML=k<1?steakSlices(1+k*1.5,false):steakSlices(1,true);if(k>=1){s();}});
              SFX.sparkle();talk('Matangnya pas, merah muda di tengah!',1800);setTimeout(()=>this.finish(),600);this.move=()=>{};}}};})());
      /* 4. hiasan */
      setStep(4);setPill(ICON.tap,'**Ketuk** titik untuk hiasan');
      await runStep((()=>{const got=new Set();const pts=GARN.map(([x,y])=>W({x,y}));
        const draw=()=>{G('tgt').innerHTML=pts.map((q,i)=>got.has(i)?'':`<circle cx="${q.x}" cy="${q.y}" r="30" fill="#3DDC97" fill-opacity=".25" stroke="#3DDC97" stroke-width="5"><animate attributeName="r" values="26;36;26" dur="1.2s" repeatCount="indefinite"/></circle>`).join('');};
        return{gest:()=>HH.tap(pts[0].x,pts[0].y),enter:draw,down(p){pts.forEach((q,i)=>{if(got.has(i))return;if(Math.hypot(p.x-q.x,p.y-q.y)<64){got.add(i);SFX.sparkle();sparkAt(q.x,q.y,8);const g=GARN[i];
          G('garn').insertAdjacentHTML('beforeend',`<g transform="translate(${g[0]} ${g[1]}) scale(1.6)">${g[2]==='f'?FLOWER(g[3]):HERB}</g>`);draw();}});
          if(got.size===pts.length){G('dots').setAttribute('opacity',1);setTimeout(()=>this.finish(),400);}}};})());
      /* glam moment */
      pill.style.opacity=0;glam=1;G('rays').animate([{opacity:0},{opacity:1}],{duration:600,fill:'forwards'});G('rays').setAttribute('opacity',1);
      SFX.win();confetti(100);talk('Cantik banget, Chef!',2200);
      const st=h('div','cdown','PLATING JUARA!',fxEl);st.style.cssText='font-size:84px;top:300px;color:#FFE7A0;text-shadow:0 8px 0 #B8862A,0 18px 30px rgba(0,0,0,.25)';
      st.animate([{transform:'translate(-50%,-50%) scale(2) rotate(-10deg)',opacity:0},{transform:'translate(-50%,-50%) scale(.95) rotate(-4deg)',opacity:1,offset:.6},{transform:'translate(-50%,-50%) scale(1) rotate(-4deg)',opacity:1}],{duration:600,easing:'ease-in',fill:'forwards'});SFX.stamp();
      await sleep(2300);st.animate([{opacity:1},{opacity:0}],{duration:300,fill:'forwards'}).onfinish=()=>st.remove();
      /* 5. cloche (top-down dome) */
      setStep(5);setPill(ICON.cloche,'**Ketuk** tudung saji untuk menutup');
      const clo=G('clo');const CX0=360,CY0=1040,S0=.26;clo.setAttribute('transform',`translate(${CX0} ${CY0}) scale(${S0})`);clo.setAttribute('opacity',1);SFX.pop();
      await runStep((()=>{let busy=false;return{gest:()=>HH.tap(CX0,CY0),
        update(){if(!busy)clo.setAttribute('transform',`translate(${CX0} ${CY0}) scale(${(S0*(1+Math.sin(T*6)*.05)).toFixed(3)})`);},
        down(p){if(busy||Math.hypot(p.x-CX0,p.y-CY0)>130)return;busy=true;pill.style.opacity=0;SFX.whoosh();const t0=performance.now();
          const s=onTick(()=>{const k=Math.min(1,(performance.now()-t0)/750),e=easeInOut(k),lift=Math.sin(k*Math.PI)*160,sc=lerp(S0,1,e)*(1+Math.sin(k*Math.PI)*.12);
            clo.setAttribute('transform',`translate(${lerp(CX0,PC.x,e).toFixed(1)} ${(lerp(CY0,PC.y,e)-lift).toFixed(1)}) scale(${sc.toFixed(3)})`);
            if(k>=1){s();SFX.bell();sparkAt(PC.x,PC.y,16);clo.animate([{transform:`translate(${PC.x}px,${PC.y}px) scale(1.04)`},{transform:`translate(${PC.x}px,${PC.y}px) scale(1)`}],{duration:300,easing:SPRING});this.finish();}});}};})());
      setStep(6);talk('Hidangan sempurna siap disajikan!',2400);confetti(70);await sleep(2400);
      stopT();Snd.pour(0);done();
    })();
  });
}

/* =========================================================
   MINIGAME 3 — Flip steak bareng Bara (side view pan toss)
   ketuk = lempar, geser = gerakkan panci untuk menangkap
   ========================================================= */
function gameGrill(){
  return new Promise(done=>{
    setScene(bgStove());hud('full');Snd.mood('game');
    const talk=comms('bara',236);
    const PY=640,GRAV=820,NEED=2;
    const STEAK=(flip)=>`<g><ellipse cx="0" cy="0" rx="78" ry="22" fill="${flip?'#D9475A':'#7A3518'}"/><path d="M-78 0A78 22 0 0 0 78 0Z" fill="${flip?'#7A3518':'#D9475A'}"/><path d="M-70 -2H70" stroke="#F3DCCB" stroke-width="5" stroke-linecap="round" opacity=".7"/>
      <path d="M-46 ${flip?10:-10}l20 0M-6 ${flip?12:-12}l20 0M34 ${flip?10:-10}l20 0" stroke="#3A1408" stroke-width="5" stroke-linecap="round" opacity=".7"/><ellipse cx="-30" cy="-12" rx="22" ry="4" fill="#fff" opacity=".25"/></g>`;
    const wrap=h('div','work',`<svg viewBox="0 0 720 1200" width="720" height="1200" xmlns="http://www.w3.org/2000/svg"><defs>
      <linearGradient id="fp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A505E"/><stop offset="1" stop-color="#1E222C"/></linearGradient>
      <radialGradient id="fg"><stop offset="0" stop-color="#FF8A3D" stop-opacity=".85"/><stop offset="1" stop-color="#FF5A1F" stop-opacity="0"/></radialGradient></defs>
      <g id="glow"><ellipse cx="0" cy="${PY+70}" rx="150" ry="40" fill="url(#fg)"/></g>
      <ellipse id="shd" cx="360" cy="716" rx="70" ry="10" fill="#000" opacity=".2"/>
      <g id="pan"><path d="M110 -8L270 -40" stroke="#2B2738" stroke-width="20" stroke-linecap="round"/><path d="M118 -12L262 -40" stroke="#4A4658" stroke-width="5" stroke-linecap="round"/>
        <path d="M-130 -10H130L114 26Q0 40 -114 26Z" fill="url(#fp)"/><rect x="-136" y="-16" width="272" height="12" rx="6" fill="#8E96A6"/><path d="M-120 -10H120" stroke="#fff" stroke-width="2" opacity=".35"/></g>
      <g id="stk"></g><g id="spk"></g><g id="sp"></g>
    </svg><div class="work-in"></div>`,uiEl);
    const svg=wrap.querySelector('svg'),inp=wrap.querySelector('.work-in'),G=id=>svg.querySelector('#'+id);
    const pill=h('div','gpill light','',uiEl);pill.style.bottom='60px';pill.style.opacity=0;
    const setPill=(ic,t)=>{pill.innerHTML=ic+'<span>'+fmt(t)+'</span>';pill.style.opacity=1;pill.animate([{transform:'translate(-50%,20px)',opacity:0},{transform:'translate(-50%,0)',opacity:1}],{duration:380,easing:SPRING});};
    const setM=meter(ICON.flip,NEED);
    let px=360,tx=360,pv=0,jerk=0,state='intro',flips=0,T=0,hh=null,dragging=false,down0=null,moved=0;
    const S_={x:360,y:PY-34,vx:0,vy:0,a:0,va:0,air:false,side:0,fade:1};
    const sprinkle=[];
    function toss(){if(!(state==='play'&&!S_.air))return;S_.air=true;S_.vy=-840;S_.vx=rand(-120,120);S_.va=180/(2*840/GRAV);jerk=1;SFX.whoosh();Snd.pour(.15);
      if(hh){hh();hh=null;}if(flips===0)setTimeout(()=>{if(S_.air&&!dragging)hh=HH.drag(px-120,760,px+120,760);setPill(ICON.swipe,'**Geser** panci ke bawah steak');},350);}
    function land(caught){S_.air=false;flips++;setM(flips);if(hh){hh();hh=null;}
      if(caught){S_.y=PY-34;S_.a=Math.round(S_.a/180)*180;S_.side^=1;SFX.sizzle();SFX.ding();sparkAt(S_.x,PY-40,10);talk(pick(['Mantap, Chef!','Balikannya cantik!','Wah, juara!']),1600);Snd.pour(.5);}
      else{SFX.bump();talk('Tenang, Bara ada cadangan kok!',2000);S_.x=px;S_.y=PY-34;S_.a=0;S_.vx=0;S_.fade=0;}
      if(flips>=NEED){state='end';pill.style.opacity=0;setTimeout(finish,900);}else setPill(ICON.tap,'**Ketuk** untuk lempar lagi');}
    inp.addEventListener('pointerdown',e=>{e.preventDefault();try{inp.setPointerCapture(e.pointerId);}catch(_){}const p=toStage(e.clientX,e.clientY);down0={id:e.pointerId,x:p.x,y:p.y};moved=0;dragging=true;});
    inp.addEventListener('pointermove',e=>{if(!down0||e.pointerId!==down0.id)return;const p=toStage(e.clientX,e.clientY);moved=Math.max(moved,Math.abs(p.x-down0.x));tx=clamp(p.x,140,580);if(moved>20&&hh&&S_.air){hh();hh=null;}});
    const up=e=>{if(!down0||e.pointerId!==down0.id)return;if(moved<20)toss();down0=null;dragging=false;};inp.addEventListener('pointerup',up);inp.addEventListener('pointercancel',up);
    const kd=e=>{if(e.code==='Space'){e.preventDefault();toss();}if(e.code==='ArrowLeft')tx=clamp(tx-70,140,580);if(e.code==='ArrowRight')tx=clamp(tx+70,140,580);};addEventListener('keydown',kd);
    const stop=onTick(dt=>{T+=dt;
      /* gentle auto-assist: pan drifts toward a falling steak when not dragged */
      if(S_.air&&!dragging&&S_.vy>0)tx+=(clamp(S_.x,140,580)-tx)*Math.min(1,dt*1.6);
      const ox=px;px+=(tx-px)*Math.min(1,dt*14);pv=(px-ox)/Math.max(dt,.001);jerk=Math.max(0,jerk-dt*5);
      if(S_.air){S_.vy+=GRAV*dt;S_.x+=S_.vx*dt;S_.y+=S_.vy*dt;S_.a+=S_.va*dt;if(S_.x<90||S_.x>630){S_.vx*=-1;S_.x=clamp(S_.x,90,630);}
        if(S_.vy>0&&S_.y>=PY-34&&S_.y<PY+10&&Math.abs(S_.x-px)<150)land(true);
        else if(S_.y>1250)land(false);}
      else{S_.x=px;S_.fade=Math.min(1,S_.fade+dt*2);}
      const tilt=clamp(-pv*.012,-10,10)-jerk*14;
      G('pan').setAttribute('transform',`translate(${px.toFixed(1)} ${(PY-jerk*26).toFixed(1)}) rotate(${tilt.toFixed(1)}) scale(1.25)`);
      G('glow').setAttribute('transform',`translate(${px.toFixed(1)} 0)`);
      const sy=S_.air?S_.y:PY-34-jerk*26;
      G('stk').innerHTML=`<g transform="translate(${S_.x.toFixed(1)} ${sy.toFixed(1)}) rotate(${S_.a.toFixed(1)}) scale(1.25)" opacity="${S_.fade.toFixed(2)}">${STEAK(S_.side)}</g>`;
      const h2=Math.max(0,PY-S_.y);G('shd').setAttribute('cx',S_.x.toFixed(1));G('shd').setAttribute('rx',(70/(1+h2/400)).toFixed(1));
      let sp='';for(let i=sprinkle.length-1;i>=0;i--){const q=sprinkle[i];q.vy+=900*dt;q.y+=q.vy*dt;q.x+=q.vx*dt;if(q.y>PY-34){sprinkle.splice(i,1);continue;}sp+=`<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="3" fill="${q.c}"/>`;}G('sp').innerHTML=sp;
      if(!S_.air&&Math.random()<dt*3&&state==='play')SFX.sizzle();
    });
    async function finish(){Snd.pour(0);pill.style.opacity=0;talk('Bumbu racikan saya jadi juara!',2600);SFX.win();confetti(70);await sleep(2600);stop();removeEventListener('keydown',kd);Snd.pour(0);done();}
    (async()=>{
      await tutorial(ICON.flip,'Flip Steak',[[ICON.tap,'**Ketuk** untuk melempar steak'],[ICON.swipe,'**Geser** panci untuk menangkap'],[ICON.steak,`Balik steak ${NEED} kali`]],'Mulai');
      talk('Pakai bumbu racikan saya, Chef!',2200);
      for(let i=0;i<26;i++)sprinkle.push({x:360+rand(-70,70),y:PY-260+rand(-40,0),vx:rand(-20,20),vy:rand(0,120),c:pick(['#C2662E','#7A3A1A','#E8A050'])});SFX.shake();
      await sleep(1600);Snd.pour(.4);state='play';setPill(ICON.tap,'**Ketuk** untuk melempar');hh=HH.tap(360,560);
    })();
  });
}

  st.animate([{transform:'translate(-50%,-50%) scale(2.4) rotate(-12deg)',opacity:0},{transform:'translate(-50%,-50%) scale(.95) rotate(-4deg)',opacity:1,offset:.6},{transform:'translate(-50%,-50%) scale(1) rotate(-4deg)',opacity:1}],{duration:600,easing:'ease-in',fill:'forwards'});
  SFX.stamp();confetti(110);SFX.win();Snd.mood('win');await sleep(1700);st.animate([{opacity:1},{opacity:0}],{duration:300,fill:'forwards'});
  await say('tamu','Rasanya kompak sekali. Tim {B} hebat!',{ex:'happy'});
  await say('me','Ini hasil kerja seluruh tim, terima kasih.',{ex:'happy'});
  await cta('Lanjut');
}
/* ---------- reflection ---------- */
async function scrReflect(){
  await wipe(async()=>{setScene(bgSoft());hud('full');});
  const KL=[['leo','Leo lambat karena baru pindah, bukan malas.'],['mira','Ditemani sebentar, Mira jadi tenang.'],['bara','Didengar sampai tuntas, idenya jadi andalan.'],['vina','Dipercaya, Vina memimpin pengantaran.']];
  const c=h('div','rcard card',`<div class="chip" style="box-shadow:none;background:#E6F6F2"><span class="ci" style="background:var(--teal)">${ICON.link}</span>CONNECT = I Know You</div><div class="h1" style="margin-top:18px">Ingat dengan KLIK</div><div class="klik">${KL.map(([k,t])=>`<div class="kl"><span class="lt" style="--lc:${LC[k]}">${NPC[k].L}</span><div style="flex:1;min-width:0"><b>${NPC[k].klik}</b><span>${fmt(t)}</span></div><span class="av">${headSVG(k)}</span></div>`).join('')}</div>`,uiEl);
  c.style.top='140px';popIn(c);
  const kls=$$('.kl',c);for(let i=0;i<kls.length;i++){await sleep(i?650:700);kls[i].classList.add('on');SFX.ding();}
  await cta('Lanjut',{delay:200});
  c.animate([{opacity:1},{opacity:0,transform:'translateY(-30px)'}],{duration:300,fill:'forwards'});await sleep(300);c.remove();
  const c2=h('div','rcard card',`<div style="width:170px;height:170px;margin:0 auto 18px;border-radius:50%;background:#FFF1E3;display:grid;place-items:center"><div style="width:110px;height:110px">${ICON.door}</div></div><div class="h1">Buka ruang,<br>jangan mengorek.</div><p class="lead" style="margin-top:18px">Kenali dari <b style="color:var(--coral)">cara kerja, kekuatan, dan tantangannya</b>.</p>`,uiEl);
  c2.style.top='270px';popIn(c2);
  await cta('Selesai',{cls:'teal',icon:ICON.check});
}
/* ---------- finale ---------- */
async function scrFinal(){
  Snd.mood('win');
  await wipe(async()=>{setScene(bgRoyal());hud('full');$('#copy').classList.add('dark');});
  const pos=[['vina',100,'wave'],['leo',225,'cheer'],['me',360,'cheer'],['mira',495,'cheer'],['bara',620,'wave']];
  pos.forEach(([k,x,p],i)=>{const r=addChar(k,{cx:x,y:700,w:k==='me'?220:180,pose:p,ex:'laugh',z:k==='me'?3:2});r.el.style.visibility='hidden';setTimeout(()=>{r.el.style.visibility='';popIn(r.el);r.hop(1);},200+i*150);});
  setTimeout(()=>{confetti(110);SFX.win();},800);
  try{window.parent.postMessage("scoreBarFound", "*");}catch(e){}
  try{window.top.postMessage("scoreBarFound", "*");}catch(e){}
  const rp=h('div','report card',`<div class="h1" style="font-size:44px">Misi selesai, ${SAP()} ${esc(S.name)}!</div><div class="tags">${KEYS.map(k=>`<div class="tg"><span class="avw"><span class="av" style="--tc:${NPC[k].c2}">${headSVG(k)}</span><span class="tick ck">${ICON.check}</span></span><b><span class="lt" style="--lc:${LC[k]}">${NPC[k].L}</span>${NPC[k].name}</b></div>`).join('')}</div>`,uiEl);
  rp.style.paddingBottom='150px';popIn(rp,900);
  await cta('Main lagi',{cls:'teal',icon:`<span style="width:38px;height:38px;color:#fff">${ICON.replay}</span>`,bottom:112,delay:1200});
}

/* =========================================================
   MAIN FLOW
   ========================================================= */
async function safe(fn,...a){try{return await fn(...a);}catch(e){console.error('[game]',fn.name,e);try{TAP=null;endTalk();}catch(_){}return null;}}
async function play(){
  const g=await scrGate();
  S.gender=g.sal==='Bu'?'ibu':'bapak';
  S.name=String(g.name||'Leader').trim().split(' ').map(x=>x.charAt(0).toUpperCase()+x.slice(1)).join(' ').slice(0,16);
  Snd.init();Snd.setOn(g.music!==false);$('#bgmBtn').classList.toggle('off',!Snd.on);Snd.mood('main');setWho();
  const intro=safe(scrIntro,true);
  await sleep(250);g.frame.animate([{opacity:1},{opacity:0}],{duration:1000,easing:'ease',fill:'forwards'}).finished.then(()=>g.frame.remove());
  await intro;
  while(true){
    while(!KEYS.every(k=>S.done[k])){
      CUR_NPC=null;const k=await scrHub();CUR_NPC=k;
      await safe(scrInvestigate,k);
      let ok=await safe(scrChat,k,false);
      while(ok===false){await safe(scrBad,k);ok=await safe(scrChat,k,true);}
      await safe(scrReveal,k);
      await safe(async()=>{let gp;await wipe(async()=>{gp=NPC[k].game();});await gp;});
      await safe(scrResult,k);
    }
    CUR_NPC='vina';
    await safe(async()=>{let gp;await wipe(async()=>{gp=gamePlate();});await gp;});
    CUR_NPC=null;
    await safe(scrServe);
    await safe(scrReflect);
    await safe(scrFinal);
    S.done={};S.tries={};
  }
}
play();

})();
</script>
